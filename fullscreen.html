<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Explorer - MCP Logger</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/fullscreen.css" />
  </head>
  <body>
    <div class="ex-shell">
      <header class="app-bar">
        <div class="app-brand">
          <img src="./images/cloud/cloud-32.png" alt="" />
          MCP Logger
        </div>
        <nav class="app-nav" aria-label="Pages">
          <a href="fullscreen.html" aria-current="page">Events</a>
          <a href="settings.html" id="BtnFsSdkTools">SDK Tools</a>
        </nav>
        <div class="app-spacer"></div>
        <div class="app-actions">
          <span class="ex-total mono" id="fsTotalStat">0 events</span>
          <div class="ex-export">
            <button
              class="btn btn-primary"
              id="BtnFsExport"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="fsExportMenu"
            >
              Export
            </button>
            <div class="menu ex-export-menu" id="fsExportMenu" role="menu" hidden>
              <fieldset class="ex-export-scope">
                <legend class="field-label">Events</legend>
                <label><input type="radio" name="fsExportScope" value="view" checked /> This view (<span id="fsExportViewCount">0</span>)</label>
                <label><input type="radio" name="fsExportScope" value="all-sites" /> All sites, same filters (<span id="fsExportAllCount">0</span>)</label>
              </fieldset>
              <label class="ex-export-mask"><input type="checkbox" id="fsExportMask" checked /> Hide personal data (emails, names, phone, address, tokens)</label>
              <div class="ex-export-actions">
                <button class="btn btn-primary" type="button" data-export="agent" role="menuitem">Copy for agent (Markdown)</button>
                <button class="btn" type="button" data-export="md" role="menuitem">Download Markdown</button>
                <button class="btn" type="button" data-export="json" role="menuitem">Download JSON</button>
                <button class="btn" type="button" data-export="html" role="menuitem">Download HTML report</button>
              </div>
              <p class="hint">
                Copy for agent cuts each payload at 4,000 characters so it fits
                in a prompt. The downloads keep full payloads.
              </p>
            </div>
          </div>
          <button class="btn" id="BtnFsRefresh" type="button">Refresh</button>
          <button class="btn btn-danger" id="BtnFsClear" type="button">Clear all</button>
        </div>
      </header>

      <section class="ex-toolbar" aria-label="Filters">
        <div class="ex-search">
          <input
            class="input"
            id="fsSearch"
            type="search"
            placeholder="Filter by action, URL or payload text"
            aria-label="Filter events"
          />
          <kbd class="ex-kbd" aria-hidden="true">/</kbd>
        </div>
        <div class="seg" id="fsTimeChips" role="group" aria-label="Time range">
          <button type="button" data-range="15m">15m</button>
          <button type="button" data-range="1h">1h</button>
          <button type="button" data-range="24h" class="active">24h</button>
          <button type="button" data-range="today">Today</button>
          <button type="button" data-range="7d">7d</button>
          <button type="button" data-range="all">All</button>
          <button type="button" data-range="custom">Custom</button>
        </div>
        <div class="ex-custom-range" id="fsCustomRange" hidden>
          <input class="input" type="datetime-local" id="fsFrom" aria-label="From" />
          <span class="ex-muted">to</span>
          <input class="input" type="datetime-local" id="fsTo" aria-label="To" />
        </div>
        <div class="seg" id="fsStatusChips" role="group" aria-label="Status">
          <button type="button" data-status="all" class="active">All statuses</button>
          <button type="button" data-status="failed">Failed</button>
        </div>
        <div class="seg ex-sort" role="group" aria-label="Sort">
          <button type="button" data-sort="desc" class="active">Newest</button>
          <button type="button" data-sort="asc">Oldest</button>
        </div>
        <span class="ex-muted" id="fsFilteredStat">0 shown</span>
      </section>

      <main class="ex-main">
        <nav class="ex-sites" id="fsSiteTabs" aria-label="Captured sites"></nav>

        <section class="ex-stream" aria-labelledby="fsStreamSubtitle">
          <div class="ex-stream-head">
            <span class="ex-col-time">Time</span>
            <span class="ex-col-status">Status</span>
            <span class="ex-col-action">Action</span>
            <span class="ex-col-page" id="fsStreamSubtitle">Page</span>
          </div>
          <div class="ex-timeline" id="fsTimeline" role="listbox" aria-label="Events" tabindex="0"></div>
        </section>

        <aside class="ex-detail" aria-label="Event details">
          <div class="ex-detail-head">
            <strong id="fsDetailTitle">Event details</strong>
            <div class="ex-detail-actions">
              <button class="btn btn-sm" id="BtnCopyEventAgent" type="button" title="Copy this event as Markdown for an AI agent (personal data hidden)">Copy for agent</button>
              <button class="btn btn-sm" id="BtnCopyJson" type="button">Copy JSON</button>
              <button class="btn btn-sm" id="BtnDownloadJson" type="button">Download</button>
            </div>
          </div>
          <div class="ex-detail-body" id="fsDetailBody">
            <div class="empty">
              <strong>No event selected</strong>
              Pick an event to see its payload.
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script src="./js/moment-with-locales.min.js"></script>
    <script src="./js/json-viewer.js"></script>
    <script src="./js/events.js"></script>
    <script src="./js/exporters.js"></script>
    <script src="./js/fullscreen.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Logger</title>
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/popup.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="app-brand">
        <img src="./images/cloud/cloud-32.png" alt="" />
        MCP Logger
      </div>
      <div class="app-spacer"></div>
      <div class="app-actions">
        <button class="btn btn-ghost" id="BtnFeedback" type="button" title="Report a problem or suggest something">Feedback</button>
        <button class="btn" id="BtnSdkTools" type="button" title="Redirect or edit the SDK">SDK Tools</button>
        <button class="btn btn-primary" id="BtnFullScreen" type="button" title="Open the full Event Explorer">Open Explorer</button>
      </div>
    </header>

    <div class="pp-sdk" id="sdkBar" hidden>
      <button class="pp-sdk-text" id="sdkStatus" type="button"></button>
      <button class="btn btn-danger btn-sm" id="BtnSdkStop" type="button" title="Switch SDK Tools off and reload open tabs on the listed sites">Stop</button>
    </div>

    <div class="pp-summary">
      <span id="summaryText">Loading...</span>
      <div class="pp-summary-actions">
        <button class="btn btn-sm btn-ghost" id="BtnRefresh" type="button">Refresh</button>
        <button class="btn btn-sm btn-ghost btn-danger" id="BtnClear" type="button">Clear all</button>
      </div>
    </div>

    <div class="pp-sites" id="siteChips" role="group" aria-label="Filter by site"></div>

    <div class="pp-list" id="eventList" role="list"></div>

    <details class="pp-decode" id="decodeSection">
      <summary>Decode a base64 payload</summary>
      <textarea
        class="input mono"
        id="atob"
        rows="3"
        spellcheck="false"
        placeholder="Paste the event= value from a beacon URL"
      ></textarea>
      <div class="pp-decode-out" id="json" hidden></div>
      <div class="pp-decode-actions" id="bd-clipboard" hidden>
        <button class="btn btn-sm" id="BtnCopyJson" type="button">Copy JSON</button>
        <button class="btn btn-sm" id="BtnDownloadJson" type="button">Download</button>
      </div>
    </details>

    <footer class="pp-credit"><span class="app-credit">Created by <a href="https://www.linkedin.com/in/mathesk/" target="_blank" rel="noopener noreferrer">Mathes</a>, Ateko</span></footer>

    <script src="./js/moment-with-locales.min.js"></script>
    <script src="./js/json-viewer.js"></script>
    <script src="./js/sdk-config.js"></script>
    <script src="./js/events.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
